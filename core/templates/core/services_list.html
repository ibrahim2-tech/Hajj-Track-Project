{% extends "layout.html" %}
{% block content %}

<h3 class="mb-3">Available Campaigns</h3>

<table class="table table-striped table-bordered table-hover">
    <thead class="table-beige">
        <tr>
            <th>Campaign Name</th>
            <th>Category</th>
            <th>Location</th>
            <th>Cost</th>
            <th>Details</th>
        </tr>
    </thead>

    <tbody>
        {% for s in services %}
        <tr>
            <td>{{ s.title }}</td>
            <td>{{ s.category }}</td>
            <td>{{ s.camp_location }}</td>
            <td>{{ s.cost }} SAR</td>
            <td>
                <a href="{% url 'detail' s.id %}" class="btn btn-beige btn-sm">
                    View Details
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">No campaigns available.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
