{% extends "layout.html" %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 500px;">
    <h4>Register Pilgrim</h4>
    <form method="POST">
        {% csrf_token %}
        <input name="username" class="form-control mb-2" placeholder="Username" required>
        <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
        <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
        <input name="nationality" class="form-control mb-2" placeholder="Nationality" required>
        <select name="identity_type" class="form-select mb-2">
            <option value="National">National ID</option>
            <option value="Passport">Passport</option>
        </select>
        <input name="identity_number" class="form-control mb-2" placeholder="ID/Passport Number" required>
        <select name="gender" class="form-select mb-2"><option value="M">Male</option><option value="F">Female</option></select>
        <button class="btn btn-success w-100">Register</button>
    </form>
<div class="mt-3">
    <p>Already have an account? <a href="{% url 'login' %}">Back to Login</a></p>
</div>
</div>
{% endblock %}
