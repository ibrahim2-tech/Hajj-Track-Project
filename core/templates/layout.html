<!DOCTYPE html>
<html>
<head>
    <title>Hajj-Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f1e7;
        }

        .navbar-custom {
            background-color: #d8c3a5;
        }

        .btn-beige {
            background-color: #d8c3a5;
            border-color: #d8c3a5;
            color: #3b2f2f;
        }

        .btn-beige:hover {
            background-color: #c9ad8b;
            border-color: #c9ad8b;
            color: #3b2f2f;
        }

        .table-beige th {
            background-color: #d8c3a5;
            color: #3b2f2f;
        }
    </style>
</head>

<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'services_list' %}">Hajj-Track</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'services_list' %}">Campaigns</a>
                <a class="nav-link" href="{% url 'add' %}">Add Campaign</a>
                <a class="nav-link" href="{% url 'logout' %}">Logout</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
